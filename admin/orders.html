<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order Management — Admin Panel</title>
  <meta name="description" content="View and manage all customer orders across the platform.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content">
    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="stat-card stat-purple"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-bag-check-fill"></i></div><span class="stat-trend"><i class="bi bi-arrow-up me-1"></i>+5%</span></div><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Orders</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-green"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-check-circle-fill"></i></div><span class="stat-trend">Fulfilled</span></div><div class="stat-value" id="statDelivered">0</div><div class="stat-label">Delivered</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-orange"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-clock-fill"></i></div><span class="stat-trend">Action Needed</span></div><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-red"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-x-circle-fill"></i></div><span class="stat-trend">Refunded</span></div><div class="stat-value" id="statCancelled">0</div><div class="stat-label">Cancelled</div></div></div>
    </div>

    <!-- Orders Table -->
    <div class="data-card">
      <div class="data-card-header">
        <div class="data-card-title"><i class="bi bi-bag-check me-2 text-primary"></i>All Orders</div>
        <div class="d-flex gap-2 flex-wrap">
          <div class="search-bar" style="max-width:220px"><i class="bi bi-search"></i><input type="text" id="searchOrders" class="form-control" placeholder="Search orders..."></div>
          <!-- Status Filter Tabs -->
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-primary-custom fw-600 active" onclick="filterOrders('all',this)">All</button>
            <button class="btn btn-sm btn-outline-primary-custom fw-600" onclick="filterOrders('Delivered',this)">Delivered</button>
            <button class="btn btn-sm btn-outline-primary-custom fw-600" onclick="filterOrders('Processing',this)">Processing</button>
            <button class="btn btn-sm btn-outline-primary-custom fw-600" onclick="filterOrders('Pending',this)">Pending</button>
            <button class="btn btn-sm btn-outline-primary-custom fw-600" onclick="filterOrders('Cancelled',this)">Cancelled</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table-custom" id="ordersTable">
          <thead><tr><th>Order ID</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Order Details Modal -->
<div class="modal fade modal-custom" id="orderDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-700"><i class="bi bi-bag-check me-2"></i>Order Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="orderDetailBody">
        <div class="text-center py-4"><div class="spinner-ring"></div></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary-custom" data-bs-dismiss="modal">Close</button>
        <div class="dropdown">
          <button class="btn btn-primary-custom fw-600 dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-arrow-repeat me-1"></i>Update Status</button>
          <ul class="dropdown-menu shadow border-0" style="border-radius:10px">
            <li><a class="dropdown-item py-2" href="#" onclick="showToast('Status → Processing','info')"><i class="bi bi-clock-history me-2 text-info"></i>Processing</a></li>
            <li><a class="dropdown-item py-2" href="#" onclick="showToast('Status → Delivered','success')"><i class="bi bi-check-circle me-2 text-success"></i>Delivered</a></li>
            <li><a class="dropdown-item py-2" href="#" onclick="showToast('Status → Cancelled','error')"><i class="bi bi-x-circle me-2 text-danger"></i>Cancelled</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
const orders = DummyData.orders;

function renderOrders(filtered) {
  const tbody = document.getElementById('ordersBody');
  tbody.innerHTML = '';
  filtered.forEach(o => {
    tbody.innerHTML += `<tr data-status="${o.status}">
      <td class="fw-600 text-primary">${o.id}</td>
      <td style="font-size:.88rem">${o.date}</td>
      <td>${o.items} items</td>
      <td class="fw-600">${formatCurrency(o.total)}</td>
      <td>${getStatusBadge(o.status)}</td>
      <td>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-primary-custom" onclick="viewOrder('${o.id}')"><i class="bi bi-eye me-1"></i>View</button>
        </div>
      </td>
    </tr>`;
  });
}

function filterOrders(status, btn) {
  document.querySelectorAll('[onclick^="filterOrders"]').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderOrders(status==='all' ? orders : orders.filter(o=>o.status===status));
}

function viewOrder(id) {
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  document.getElementById('orderDetailBody').innerHTML = `
    <div class="d-flex justify-content-between mb-3">
      <div><div class="fw-700" style="font-size:1.1rem">${o.id}</div><small class="text-muted">${o.date}</small></div>
      <div>${getStatusBadge(o.status)}</div>
    </div>
    <div class="p-3 rounded-3" style="background:var(--gray-100)">
      <div class="d-flex justify-content-between mb-2"><span class="text-muted">Items</span><span class="fw-600">${o.items} items</span></div>
      <div class="d-flex justify-content-between mb-2"><span class="text-muted">Subtotal</span><span class="fw-600">${formatCurrency(o.total * 0.9)}</span></div>
      <div class="d-flex justify-content-between mb-2"><span class="text-muted">Tax (10%)</span><span class="fw-600">${formatCurrency(o.total * 0.1)}</span></div>
      <hr><div class="d-flex justify-content-between"><span class="fw-700">Total</span><span class="fw-700 text-primary" style="font-size:1.1rem">${formatCurrency(o.total)}</span></div>
    </div>`;
  new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebarMount').innerHTML = ADMIN_SIDEBAR('orders');
  document.getElementById('headerMount').innerHTML = ADMIN_HEADER('Order Management','Orders');
  initSidebar('adminSidebar','adminOverlay');

  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statDelivered').textContent = orders.filter(o=>o.status==='Delivered').length;
  document.getElementById('statPending').textContent = orders.filter(o=>o.status==='Pending').length;
  document.getElementById('statCancelled').textContent = orders.filter(o=>o.status==='Cancelled').length;

  renderOrders(orders);
  filterTable('searchOrders','ordersTable');
});
</script>
</body>
</html>
