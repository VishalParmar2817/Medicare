<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Medicine Catalog — Admin Panel</title>
  <meta name="description" content="Manage the full medicine catalog — add, edit, search, and filter medicines.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
<div id="sidebarMount"></div>
<div class="admin-main">
  <div id="headerMount"></div>
  <div class="admin-content">
    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="stat-card stat-green"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-capsule-pill"></i></div><span class="stat-trend"><i class="bi bi-arrow-up me-1"></i>+8%</span></div><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Medicines</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-blue"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-boxes"></i></div><span class="stat-trend">Available</span></div><div class="stat-value" id="statInStock">0</div><div class="stat-label">In Stock</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-orange"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-exclamation-triangle-fill"></i></div><span class="stat-trend">Action Needed</span></div><div class="stat-value" id="statLowStock">0</div><div class="stat-label">Low Stock</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-red"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon"><i class="bi bi-file-medical-fill"></i></div><span class="stat-trend">Rx-only</span></div><div class="stat-value" id="statRx">0</div><div class="stat-label">Rx Required</div></div></div>
    </div>

    <!-- Medicine Table -->
    <div class="data-card">
      <div class="data-card-header">
        <div class="data-card-title"><i class="bi bi-capsule me-2 text-primary"></i>Medicine Catalog</div>
        <div class="d-flex gap-2 flex-wrap">
          <div class="search-bar" style="max-width:220px"><i class="bi bi-search"></i><input type="text" id="searchMed" class="form-control" placeholder="Search medicines..."></div>
          <select class="form-select form-control-custom" id="catFilter" style="max-width:160px;height:40px;font-size:.88rem">
            <option value="">All Categories</option>
          </select>
          <button class="btn btn-primary-custom fw-600" data-bs-toggle="modal" data-bs-target="#addMedModal"><i class="bi bi-plus me-1"></i>Add Medicine</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table-custom" id="medTable">
          <thead><tr><th>ID</th><th>Medicine</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Rx</th><th>Actions</th></tr></thead>
          <tbody id="medBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Add Medicine Modal -->
<div class="modal fade modal-custom" id="addMedModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-700"><i class="bi bi-capsule me-2"></i>Add New Medicine</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-600">Medicine Name</label><input type="text" class="form-control form-control-custom" placeholder="e.g. Paracetamol 500mg"></div>
          <div class="col-md-6"><label class="form-label fw-600">Brand</label><input type="text" class="form-control form-control-custom" placeholder="e.g. MedCure"></div>
          <div class="col-md-4"><label class="form-label fw-600">Category</label><select class="form-select form-control-custom" id="modalCatSelect"></select></div>
          <div class="col-md-4"><label class="form-label fw-600">Price (₹)</label><input type="number" class="form-control form-control-custom" placeholder="0.00"></div>
          <div class="col-md-4"><label class="form-label fw-600">Stock Qty</label><input type="number" class="form-control form-control-custom" placeholder="0"></div>
          <div class="col-md-6"><label class="form-label fw-600">Description</label><textarea class="form-control form-control-custom" rows="2" placeholder="Brief description..."></textarea></div>
          <div class="col-md-3"><label class="form-label fw-600">Discount (%)</label><input type="number" class="form-control form-control-custom" placeholder="0"></div>
          <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" id="rxCheck"><label class="form-check-label fw-600" for="rxCheck">Rx Required</label></div></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary-custom fw-600" onclick="showToast('Medicine added successfully!','success');bootstrap.Modal.getInstance(document.getElementById('addMedModal')).hide()"><i class="bi bi-check-lg me-1"></i>Add Medicine</button></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebarMount').innerHTML = ADMIN_SIDEBAR('medicines');
  document.getElementById('headerMount').innerHTML = ADMIN_HEADER('Medicine Catalog','Medicines');
  initSidebar('adminSidebar','adminOverlay');

  const meds = DummyData.medicines;
  const cats = DummyData.categories;
  document.getElementById('statTotal').textContent = meds.length;
  document.getElementById('statInStock').textContent = meds.filter(m=>m.stock>50).length;
  document.getElementById('statLowStock').textContent = meds.filter(m=>m.stock<=50).length;
  document.getElementById('statRx').textContent = meds.filter(m=>m.rxRequired).length;

  // Populate category filter
  const catFilter = document.getElementById('catFilter');
  const modalCat = document.getElementById('modalCatSelect');
  cats.forEach(c => {
    catFilter.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    modalCat.innerHTML += `<option>${c.name}</option>`;
  });

  const tbody = document.getElementById('medBody');
  function renderMeds(filtered) {
    tbody.innerHTML = '';
    filtered.forEach(m => {
      const stockClass = m.stock > 50 ? 'stock-in-stock' : m.stock > 0 ? 'stock-low-stock' : 'stock-out-stock';
      const stockLabel = m.stock > 50 ? 'In Stock' : m.stock > 0 ? 'Low Stock' : 'Out';
      tbody.innerHTML += `<tr data-cat="${m.category}">
        <td class="fw-600">${m.id}</td>
        <td><div class="d-flex align-items-center gap-2"><span style="font-size:1.5rem">${m.img}</span><div><div class="fw-600" style="font-size:.88rem">${m.name}</div><small class="text-muted">${m.description.substring(0,35)}...</small></div></div></td>
        <td style="font-size:.88rem">${m.brand}</td>
        <td><span class="badge-custom badge-primary">${m.category}</span></td>
        <td><span class="price-tag">${formatCurrency(m.price)}</span><br><span class="price-old">${formatCurrency(m.oldPrice)}</span></td>
        <td><span class="stock-indicator ${stockClass}"><span class="stock-dot"></span>${stockLabel} (${m.stock})</span></td>
        <td>${starRating(m.rating)}</td>
        <td>${m.rxRequired ? '<span class="badge bg-danger" style="font-size:.7rem">Rx</span>' : '<span class="badge bg-success" style="font-size:.7rem">OTC</span>'}</td>
        <td>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-primary-custom" title="Edit" onclick="showToast('Editing ${m.name}','info')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-danger-custom" title="Delete" onclick="showConfirm({title:'Delete Medicine?',message:'Remove ${m.name}?',onConfirm:()=>showToast('Medicine deleted','error')})"><i class="bi bi-trash"></i></button>
          </div>
        </td>
      </tr>`;
    });
  }
  renderMeds(meds);

  // Category Filter
  catFilter.addEventListener('change', function() {
    const val = this.value;
    renderMeds(val ? meds.filter(m=>m.category===val) : meds);
  });

  filterTable('searchMed','medTable');
});
</script>
</body>
</html>
