<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shopping Cart — MediCare Pharmacy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body>
<nav class="navbar navbar-expand-lg customer-navbar">
  <div class="container">
    <a class="navbar-brand navbar-brand-custom" href="../index.html"><div class="brand-icon"><i class="bi bi-capsule-pill"></i></div><span>Medi<b>Care</b></span></a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a href="medicines.html" class="btn btn-sm btn-outline-primary-custom">Continue Shopping</a>
      <a href="cart.html" class="cart-btn"><i class="bi bi-cart3"></i><span class="cart-count" id="navCartCount">0</span></a>
    </div>
  </div>
</nav>

<div class="py-2 px-4 bg-white border-bottom">
  <ol class="breadcrumb-custom"><li><a href="../index.html">Home</a></li><li><i class="bi bi-chevron-right small"></i></li><li>Shopping Cart</li></ol>
</div>



<div class="container py-4">
  <!-- Checkout Steps -->
  <div class="checkout-steps mb-4">
    <div class="step-item active"><div class="step-circle"><i class="bi bi-cart-check"></i></div><span class="step-label">Cart</span></div>
    <div class="step-item"><div class="step-circle">2</div><span class="step-label">Address</span></div>
    <div class="step-item"><div class="step-circle">3</div><span class="step-label">Payment</span></div>
    <div class="step-item"><div class="step-circle">4</div><span class="step-label">Confirm</span></div>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="fw-700 mb-0">Cart Items <span class="text-muted fw-400" id="cartItemCount" style="font-size:.85rem"></span></h5>
        <button class="btn btn-sm text-danger border-0 p-0" onclick="clearCart()"><i class="bi bi-trash me-1"></i>Clear Cart</button>
      </div>
      <div id="cartItems"></div>
      <!-- Coupon -->
      <div class="card-custom p-3 mt-3">
        <div class="fw-600 mb-2"><i class="bi bi-tag me-2 text-primary"></i>Apply Coupon</div>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-custom" id="couponInput" placeholder="Enter coupon code (e.g. HEALTH25)">
          <button class="btn btn-primary-custom px-3 fw-600" onclick="applyCoupon()">Apply</button>
        </div>
        <div id="couponMsg" class="mt-2"></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="order-summary">
        <h6 class="fw-700 mb-3">Order Summary</h6>
        <div class="summary-row"><span class="text-muted">Subtotal</span><span id="summSubtotal" class="fw-600"></span></div>
        <div class="summary-row"><span class="text-muted">Delivery</span><span class="text-success fw-600">FREE</span></div>
        <div class="summary-row" id="discRow" style="display:none"><span class="text-muted">Discount (25%)</span><span id="discAmt" class="text-danger fw-600"></span></div>
        <div class="summary-row"><span class="text-muted">GST (18%)</span><span id="summGst" class="fw-600"></span></div>
        <div class="summary-total"><span>Total Payable</span><span id="summTotal" class="text-primary"></span></div>
        <a href="checkout.html" class="btn btn-primary-custom w-100 mt-3 py-2 fw-600"><i class="bi bi-shield-check me-2"></i>Proceed to Checkout</a>
        <div class="mt-3 text-center">
          <small class="text-muted"><i class="bi bi-lock-fill me-1 text-success"></i>Secure & Encrypted Checkout</small>
        </div>
        <!-- Payment icons -->
        <div class="d-flex justify-content-center gap-2 mt-2 flex-wrap">
          <img src="https://img.shields.io/badge/Visa-1A1F71?style=flat&logo=visa&logoColor=white" style="height:22px" alt="Visa">
          <img src="https://img.shields.io/badge/Mastercard-EB001B?style=flat&logo=mastercard&logoColor=white" style="height:22px" alt="MC">
          <img src="https://img.shields.io/badge/UPI-success?style=flat" style="height:22px" alt="UPI">
          <img src="https://img.shields.io/badge/COD-333?style=flat" style="height:22px" alt="COD">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
// Preload demo cart
if (!Cart.count()) {
  DummyData.medicines.slice(0,3).forEach(m => Cart.add({ id:m.id, name:m.name, price:m.price, img:m.img, brand:m.brand }));
}
let discount = 0;

function renderCart() {
  const items = Cart.get();
  const container = document.getElementById('cartItems');
  document.getElementById('cartItemCount').textContent = `(${items.length} items)`;
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><i class="bi bi-cart-x"></i><h5>Your cart is empty</h5><p>Add some medicines to get started</p><a href="medicines.html" class="btn btn-primary-custom mt-2">Browse Medicines</a></div>`;
    updateSummary(0);
    return;
  }
  container.innerHTML = items.map(item => `
    <div class="cart-item" id="cartItem_${item.id}">
      <div class="cart-item-img"><span style="font-size:2rem">${item.img}</span></div>
      <div class="flex-1">
        <div class="fw-600" style="font-size:.92rem">${item.name}</div>
        <div class="text-muted small">${item.brand}</div>
        <div class="price-tag mt-1">₹${item.price}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(${item.id},-1)">-</button>
        <input class="qty-input" value="${item.qty||1}" id="qty_${item.id}" onchange="setQty(${item.id},this.value)">
        <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
      </div>
      <div class="fw-700 text-primary" style="min-width:70px;text-align:right">₹${(item.price*(item.qty||1)).toFixed(2)}</div>
      <button class="btn btn-sm text-danger border-0 p-0 ms-2" onclick="removeItem(${item.id})"><i class="bi bi-trash3"></i></button>
    </div>`).join('');
  updateSummary(Cart.total());
}

function updateSummary(sub) {
  const disc = discount ? sub * 0.25 : 0;
  const afterDisc = sub - disc;
  const gst = afterDisc * 0.18;
  const total = afterDisc + gst;
  document.getElementById('summSubtotal').textContent = '₹' + sub.toFixed(2);
  document.getElementById('summGst').textContent = '₹' + gst.toFixed(2);
  document.getElementById('summTotal').textContent = '₹' + total.toFixed(2);
  if (discount) {
    document.getElementById('discRow').style.display = '';
    document.getElementById('discAmt').textContent = '-₹' + disc.toFixed(2);
  }
}

function changeQty(id, delta) {
  const items = Cart.get();
  const item = items.find(i => i.id === id);
  if (!item) return;
  item.qty = Math.max(1, (item.qty || 1) + delta);
  Cart.save(items);
  renderCart();
}
function setQty(id, val) {
  const items = Cart.get();
  const item = items.find(i => i.id === id);
  if (item) { item.qty = Math.max(1, parseInt(val) || 1); Cart.save(items); }
  renderCart();
}
function removeItem(id) {
  showConfirm({ title:'Remove Item?', message:'Remove this item from your cart?', onConfirm: () => { Cart.remove(id); renderCart(); showToast('Item removed','warning'); }});
}
function clearCart() {
  showConfirm({ title:'Clear Cart?', message:'Remove all items from your cart?', onConfirm: () => { Cart.save([]); renderCart(); showToast('Cart cleared','info'); }});
}
function applyCoupon() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const msg = document.getElementById('couponMsg');
  if (code === 'HEALTH25') {
    discount = true;
    msg.innerHTML = '<div class="alert-custom alert-success-custom"><i class="bi bi-check-circle-fill"></i>Coupon applied! 25% discount added.</div>';
    renderCart();
  } else {
    msg.innerHTML = '<div class="alert-custom alert-danger-custom"><i class="bi bi-x-circle-fill"></i>Invalid coupon code.</div>';
  }
}
document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
