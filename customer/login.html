<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — MediCare Pharmacy</title>
  <meta name="description" content="Login to your MediCare Pharmacy account to manage orders and prescriptions.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card">
          <div class="auth-logo">
            <div class="brand-icon"><i class="bi bi-capsule-pill"></i></div>
            <div class="auth-title">Welcome Back</div>
            <div class="auth-subtitle" id="loginSubtitle">Sign in to your MediCare account</div>
          </div>
          <!-- Social Login -->
          <div class="d-flex gap-2 mb-4">
            <button class="btn border flex-1 d-flex align-items-center justify-content-center gap-2" style="font-size:.85rem;font-weight:500;flex:1">
              <img src="https://www.google.com/favicon.ico" width="16" alt="G"> Google
            </button>
            <button class="btn border flex-1 d-flex align-items-center justify-content-center gap-2" style="font-size:.85rem;font-weight:500;flex:1">
              <i class="bi bi-facebook text-primary"></i> Facebook
            </button>
          </div>
          <div class="d-flex align-items-center gap-2 mb-4">
            <hr class="flex-1 m-0"><span class="text-muted small">or sign in with email</span><hr class="flex-1 m-0">
          </div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-600 small">Email Address</label>
              <div class="input-group-custom">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="priya@example.com" required>
              </div>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-600 small mb-0">Password</label>
                <a href="forgot-password.html" class="text-primary small">Forgot Password?</a>
              </div>
              <div class="input-group-custom position-relative">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" class="form-control form-control-custom" id="loginPass" placeholder="••••••••" required style="padding-left:2.5rem;padding-right:2.5rem">
                <button type="button" class="btn p-0 position-absolute" style="right:.9rem;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--gray-400)" onclick="togglePwd('loginPass',this)"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-4">
              <input type="checkbox" class="form-check-input m-0" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Remember me for 30 days</label>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-600">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          <p class="text-center mt-4 mb-0" style="font-size:.88rem">
            Don't have an account? <a href="register.html" class="text-primary fw-600">Create Account</a>
          </p>
          <!-- Demo credentials -->
          <div class="alert-custom alert-info-custom mt-4" style="border-radius:8px;font-size:.8rem">
            <i class="bi bi-info-circle-fill"></i>
            <div><strong>Demo:</strong> priya@example.com / password123</div>
          </div>
        </div>
        <p class="text-center text-white opacity-50 mt-3" style="font-size:.8rem">
          <a href="../index.html" class="text-white">← Back to Home</a> &nbsp;|&nbsp; 
          <a href="../pharmacist/dashboard.html" class="text-white">Pharmacist Portal</a> &nbsp;|&nbsp;
          <a href="../admin/dashboard.html" class="text-white">Admin Portal</a>
        </p>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  btn.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
}
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim() || 'priya@example.com';
  // Look up a matching demo user, fallback to Priya Sharma
  const demoUsers = [
    { email:'priya@example.com',  name:'Priya Sharma' },
    { email:'rahul@example.com',  name:'Rahul Mehta' },
    { email:'anita@example.com',  name:'Anita Singh' },
    { email:'vikram@example.com', name:'Vikram Patel' },
    { email:'neha@example.com',   name:'Neha Gupta' },
  ];
  const match = demoUsers.find(u => u.email === email.toLowerCase());
  const user = { name: match ? match.name : 'Priya Sharma', email };
  showLoader();
  setTimeout(() => {
    localStorage.setItem('mcUser', JSON.stringify(user));
    hideLoader();
    // Redirect back to originating page (or replay pending cart item)
    Auth.afterLogin();
  }, 1200);
});
</script>
<script>
// Show contextual message if user was sent here from a cart action
document.addEventListener('DOMContentLoaded', () => {
  const pending = sessionStorage.getItem('mc_pending_cart');
  const returnUrl = sessionStorage.getItem('mc_return_url');
  const subtitle = document.getElementById('loginSubtitle');
  if (pending && subtitle) {
    try {
      const item = JSON.parse(pending);
      subtitle.innerHTML = `<i class="bi bi-cart3 me-1 text-primary"></i>Please sign in to add <strong>${item.name}</strong> to your cart`;
    } catch(e) {}
  } else if (returnUrl && returnUrl.includes('cart') && subtitle) {
    subtitle.innerHTML = `<i class="bi bi-cart3 me-1 text-primary"></i>Please sign in to view your cart`;
  }
});
</script>
</body>
</html>
