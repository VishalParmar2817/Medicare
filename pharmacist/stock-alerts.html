<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stock Alerts — Pharmacist Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pharmacist.css">
</head>
<body>
<div class="ph-layout" id="layout"></div>

<!-- Reorder Modal -->
<div class="modal fade modal-custom" id="reorderModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-700">Reorder Stock</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label fw-600 small">Medicine</label><input type="text" class="form-control form-control-custom" id="reorderMed" readonly></div>
        <div class="mb-3"><label class="form-label fw-600 small">Supplier</label><select class="form-control form-control-custom">
          ${DummyData.suppliers.filter(s=>s.status==='Active').map(s=>`<option>${s.name}</option>`).join('')}
        </select></div>
        <div class="row g-3">
          <div class="col-6"><label class="form-label fw-600 small">Quantity to Order</label><input type="number" class="form-control form-control-custom" placeholder="100"></div>
          <div class="col-6"><label class="form-label fw-600 small">Priority</label><select class="form-control form-control-custom"><option>Normal</option><option>Urgent</option><option>Emergency</option></select></div>
        </div>
        <div class="mt-3"><label class="form-label fw-600 small">Notes</label><textarea class="form-control form-control-custom" rows="2" placeholder="Additional notes"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary-custom fw-600" onclick="placeReorder()"><i class="bi bi-truck me-1"></i>Place Order</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pharmacist.js"></script>
<script>
const alerts = DummyData.stockAlerts;
const totalAlerts = alerts.low.length + alerts.expired.length + alerts.nearExpiry.length;

document.getElementById('layout').innerHTML = PH_SIDEBAR('stock') + `
<div class="ph-main">
  ${PH_HEADER('Stock Alerts','Stock Alerts')}
  <div class="ph-content">
    <!-- Alert Summary -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="stat-card stat-orange"><div class="d-flex justify-content-between align-items-start mb-2"><div class="stat-icon">⚠️</div><span class="badge bg-white bg-opacity-25 text-white" style="font-size:.7rem">Alert</span></div><div class="stat-value">${totalAlerts}</div><div class="stat-label">Total Alerts</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-red"><div class="stat-icon mb-2">📉</div><div class="stat-value">${alerts.low.length}</div><div class="stat-label">Low Stock Items</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-purple"><div class="stat-icon mb-2">⏰</div><div class="stat-value">${alerts.nearExpiry.length}</div><div class="stat-label">Near Expiry</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card stat-red"><div class="stat-icon mb-2">🚫</div><div class="stat-value">${alerts.expired.length}</div><div class="stat-label">Expired Items</div></div></div>
    </div>

    <!-- Critical Alert Banner -->
    ${alerts.expired.length > 0 ? `
    <div class="alert d-flex align-items-start gap-3 mb-4" style="border-radius:12px;border:none;background:rgba(239,68,68,.08);border-left:4px solid #ef4444">
      <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size:1.5rem;margin-top:2px"></i>
      <div>
        <h6 class="fw-700 text-danger mb-1">🚨 Critical: ${alerts.expired.length} Expired Medicine(s) Found</h6>
        <p class="mb-0 text-muted" style="font-size:.88rem">These medicines must be removed from stock immediately and cannot be dispensed to patients.</p>
      </div>
    </div>` : ''}

    <!-- Expired Medicines -->
    <div class="data-card mb-4">
      <div class="data-card-header">
        <div class="data-card-title"><i class="bi bi-x-octagon-fill text-danger me-2"></i>Expired Medicines</div>
        <button class="btn btn-danger-custom fw-600 btn-sm" onclick="showConfirm({title:'Remove All Expired?',message:'This will flag all expired medicines for disposal.',onConfirm:()=>showToast('Expired medicines flagged for disposal','success')})"><i class="bi bi-trash me-1"></i>Remove All</button>
      </div>
      <div class="table-wrap">
        <table class="table-custom">
          <thead><tr><th>Medicine</th><th>Batch</th><th>Category</th><th>Expiry Date</th><th>Quantity</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${alerts.expired.map(e => `
            <tr style="background:rgba(239,68,68,.03)">
              <td class="fw-600">${e.name}</td>
              <td class="text-muted small">${e.batch}</td>
              <td><span class="badge-custom badge-info">${e.category}</span></td>
              <td class="text-danger fw-600">${e.expiry}</td>
              <td>${e.qty} units</td>
              <td><span class="badge-custom badge-danger">Expired</span></td>
              <td>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-danger-custom py-0 px-2" onclick="showConfirm({title:'Remove ${e.name}?',message:'This batch will be flagged for disposal.',onConfirm:()=>showToast('Flagged for disposal','success')})"><i class="bi bi-trash"></i></button>
                  <button class="btn btn-sm btn-outline-primary-custom py-0 px-2" onclick="reorder('${e.name}')" title="Reorder"><i class="bi bi-truck"></i></button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Low Stock Items -->
    <div class="data-card mb-4">
      <div class="data-card-header">
        <div class="data-card-title"><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Low Stock Items</div>
        <button class="btn btn-primary-custom fw-600 btn-sm" onclick="showToast('Bulk reorder request sent to suppliers','success')"><i class="bi bi-truck me-1"></i>Reorder All</button>
      </div>
      <div class="table-wrap">
        <table class="table-custom">
          <thead><tr><th>Medicine</th><th>Category</th><th>Current Stock</th><th>Min. Required</th><th>Deficit</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${alerts.low.map(l => {
              const deficit = l.min - l.current;
              const pct = (l.current / l.min) * 100;
              return `
              <tr>
                <td class="fw-600">${l.name}</td>
                <td><span class="badge-custom badge-info">${l.category}</span></td>
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <div class="progress flex-1" style="height:8px;width:80px;border-radius:4px">
                      <div class="progress-bar ${pct>60?'bg-warning':'bg-danger'}" style="width:${pct}%;border-radius:4px"></div>
                    </div>
                    <span class="fw-600" style="font-size:.85rem">${l.current}</span>
                  </div>
                </td>
                <td class="text-muted">${l.min}</td>
                <td><span class="text-danger fw-600">-${deficit}</span></td>
                <td><span class="badge-custom badge-warning">Low Stock</span></td>
                <td>
                  <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-primary-custom py-0 px-2" onclick="reorder('${l.name}')" title="Reorder"><i class="bi bi-truck"></i></button>
                    <button class="btn btn-sm btn-outline-primary-custom py-0 px-2" onclick="showToast('Stock history viewed','info')" title="History"><i class="bi bi-clock-history"></i></button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Near Expiry Items -->
    <div class="data-card">
      <div class="data-card-header">
        <div class="data-card-title"><i class="bi bi-clock-history text-info me-2"></i>Near Expiry Items</div>
        <span class="text-muted small">Items expiring within 60 days</span>
      </div>
      <div class="table-wrap">
        <table class="table-custom">
          <thead><tr><th>Medicine</th><th>Batch</th><th>Category</th><th>Expiry Date</th><th>Quantity</th><th>Days Left</th><th>Priority</th><th>Actions</th></tr></thead>
          <tbody>
            ${alerts.nearExpiry.map(n => {
              const urgency = n.daysLeft <= 21 ? 'badge-danger' : n.daysLeft <= 30 ? 'badge-warning' : 'badge-info';
              const urgencyText = n.daysLeft <= 21 ? 'Critical' : n.daysLeft <= 30 ? 'High' : 'Medium';
              return `
              <tr ${n.daysLeft <= 21 ? 'style="background:rgba(239,68,68,.03)"' : ''}>
                <td class="fw-600">${n.name}</td>
                <td class="text-muted small">${n.batch}</td>
                <td><span class="badge-custom badge-info">${n.category}</span></td>
                <td class="fw-600 ${n.daysLeft <= 21 ? 'text-danger' : 'text-warning'}">${n.expiry}</td>
                <td>${n.qty} units</td>
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <div class="progress flex-1" style="height:6px;width:50px;border-radius:4px">
                      <div class="progress-bar ${n.daysLeft<=21?'bg-danger':n.daysLeft<=30?'bg-warning':'bg-info'}" style="width:${Math.max(100 - (n.daysLeft/60*100), 10)}%;border-radius:4px"></div>
                    </div>
                    <span class="fw-600" style="font-size:.85rem">${n.daysLeft}d</span>
                  </div>
                </td>
                <td><span class="badge-custom ${urgency}">${urgencyText}</span></td>
                <td>
                  <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-primary-custom py-0 px-2" onclick="showToast('Discount applied to promote sales','success')" title="Add Discount"><i class="bi bi-tag"></i></button>
                    <button class="btn btn-sm btn-outline-primary-custom py-0 px-2" onclick="reorder('${n.name}')" title="Reorder Fresh Stock"><i class="bi bi-truck"></i></button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>`;

function reorder(medName) {
  document.getElementById('reorderMed').value = medName;
  new bootstrap.Modal(document.getElementById('reorderModal')).show();
}
function placeReorder() {
  showLoader();
  setTimeout(() => {
    hideLoader();
    bootstrap.Modal.getInstance(document.getElementById('reorderModal')).hide();
    showToast('Reorder placed successfully!','success');
  }, 1000);
}

document.addEventListener('DOMContentLoaded', () => initSidebar('phSidebar','phOverlay'));
</script>
</body>
</html>
