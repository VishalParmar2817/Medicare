<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Category Management — Pharmacist Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pharmacist.css">
</head>
<body>
<div class="ph-layout" id="layout"></div>

<!-- Category Modal -->
<div class="modal fade modal-custom" id="catModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-700" id="catModalTitle">Add Category</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label fw-600 small">Category Name*</label><input type="text" class="form-control form-control-custom" id="catName" placeholder="e.g. Antibiotics"></div>
        <div class="mb-3"><label class="form-label fw-600 small">Icon (Emoji)</label><input type="text" class="form-control form-control-custom" id="catIcon" placeholder="💊"></div>
        <div class="mb-3"><label class="form-label fw-600 small">Description</label><textarea class="form-control form-control-custom" rows="2" placeholder="Brief category description"></textarea></div>
        <div class="mb-3"><label class="form-label fw-600 small">Status</label><select class="form-control form-control-custom"><option>Active</option><option>Inactive</option></select></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary-custom fw-600" onclick="saveCat()">Save Category</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pharmacist.js"></script>
<script>
const categories = [
  { id:1, name:'Pain Relief',  icon:'🩹', products:34, status:'Active',   description:'Analgesics and pain management medicines' },
  { id:2, name:'Antibiotics',  icon:'🧪', products:28, status:'Active',   description:'Broad and narrow spectrum antibiotics' },
  { id:3, name:'Vitamins',     icon:'💊', products:45, status:'Active',   description:'Essential vitamins and dietary supplements' },
  { id:4, name:'Cardiology',   icon:'❤️', products:22, status:'Active',   description:'Heart and cardiovascular medicines' },
  { id:5, name:'Diabetes',     icon:'🩸', products:18, status:'Active',   description:'Blood sugar management medicines' },
  { id:6, name:'Allergy',      icon:'🌿', products:31, status:'Active',   description:'Antihistamines and allergy relief' },
  { id:7, name:'Gastro',       icon:'🫁', products:25, status:'Inactive', description:'Digestive and gastrointestinal medicines' },
  { id:8, name:'Respiratory',  icon:'💨', products:20, status:'Active',   description:'Asthma, bronchitis, and COPD medicines' },
];

document.getElementById('layout').innerHTML = PH_SIDEBAR('category') + `
<div class="ph-main">
  ${PH_HEADER('Category Management','Category Management')}
  <div class="ph-content">
    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card stat-blue"><div class="stat-value">${categories.length}</div><div class="stat-label">Total Categories</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card stat-green"><div class="stat-value">${categories.filter(c=>c.status==='Active').length}</div><div class="stat-label">Active</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card stat-orange"><div class="stat-value">${categories.filter(c=>c.status==='Inactive').length}</div><div class="stat-label">Inactive</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card stat-cyan"><div class="stat-value">${categories.reduce((s,c)=>s+c.products,0)}</div><div class="stat-label">Total Products</div></div></div>
    </div>
    <!-- Grid View -->
    <div class="row g-3 mb-4" id="catGrid">
      ${categories.map(c => `
        <div class="col-6 col-md-4 col-lg-3">
          <div class="card-custom p-3 text-center h-100">
            <div style="font-size:2.5rem;margin-bottom:.5rem">${c.icon}</div>
            <h6 class="fw-700 mb-1">${c.name}</h6>
            <p class="text-muted mb-2" style="font-size:.78rem">${c.description}</p>
            <div class="d-flex justify-content-center gap-2 mb-2">
              <span class="badge-custom badge-primary">${c.products} products</span>
              <span class="badge-custom ${c.status==='Active'?'badge-success':'badge-danger'}">${c.status}</span>
            </div>
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-sm btn-outline-primary-custom py-0 px-2" onclick="editCat(${c.id})"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-danger-custom py-0 px-2" onclick="deleteCat(${c.id})"><i class="bi bi-trash"></i></button>
            </div>
          </div>
        </div>`).join('')}
    </div>
    <!-- Table View -->
    <div class="data-card">
      <div class="data-card-header">
        <div class="data-card-title">Category List</div>
        <button class="btn btn-primary-custom fw-600" data-bs-toggle="modal" data-bs-target="#catModal"><i class="bi bi-plus me-1"></i>Add Category</button>
      </div>
      <div class="table-wrap">
        <table class="table-custom">
          <thead><tr><th>ID</th><th>Icon</th><th>Category Name</th><th>Description</th><th>Products</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${categories.map(c => `
              <tr>
                <td class="text-muted small">#${String(c.id).padStart(3,'0')}</td>
                <td style="font-size:1.3rem">${c.icon}</td>
                <td class="fw-600">${c.name}</td>
                <td class="text-muted small">${c.description}</td>
                <td><span class="badge-custom badge-primary">${c.products}</span></td>
                <td>${c.status==='Active'?'<span class="badge-custom badge-success">Active</span>':'<span class="badge-custom badge-danger">Inactive</span>'}</td>
                <td><div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-primary-custom py-0 px-2" onclick="editCat(${c.id})"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-danger-custom py-0 px-2" onclick="deleteCat(${c.id})"><i class="bi bi-trash"></i></button>
                </div></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>`;

function editCat(id) {
  const c = categories.find(x => x.id === id);
  document.getElementById('catModalTitle').textContent = 'Edit Category';
  document.getElementById('catName').value = c.name;
  document.getElementById('catIcon').value = c.icon;
  new bootstrap.Modal(document.getElementById('catModal')).show();
}
function deleteCat(id) { showConfirm({ title:'Delete Category?', message:'All products in this category will become uncategorized.', onConfirm: () => showToast('Category deleted','error') }); }
function saveCat() { showLoader(); setTimeout(() => { hideLoader(); bootstrap.Modal.getInstance(document.getElementById('catModal')).hide(); showToast('Category saved!','success'); }, 800); }
document.addEventListener('DOMContentLoaded', () => initSidebar('phSidebar','phOverlay'));
</script>
</body>
</html>
