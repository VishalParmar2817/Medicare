<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — MediCare Pharmacy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card">
          <div class="auth-logo">
            <div class="brand-icon"><i class="bi bi-key-fill"></i></div>
            <div class="auth-title">Reset Password</div>
            <div class="auth-subtitle">Create a new strong password for your account</div>
          </div>
          <form id="resetForm" novalidate>
            <div class="mb-3">
              <label class="form-label fw-600 small">New Password</label>
              <div class="input-group-custom position-relative">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" class="form-control form-control-custom" id="np" placeholder="Min 8 characters" required style="padding-left:2.5rem;padding-right:2.5rem">
                <button type="button" class="btn p-0 position-absolute" style="right:.9rem;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--gray-400)" onclick="togglePwd('np',this)"><i class="bi bi-eye"></i></button>
              </div>
              <!-- Strength indicator -->
              <div class="mt-2">
                <div class="d-flex gap-1 mb-1" id="strengthBars">
                  <div class="flex-1 rounded" style="height:4px;background:var(--gray-300)" id="sb1"></div>
                  <div class="flex-1 rounded" style="height:4px;background:var(--gray-300)" id="sb2"></div>
                  <div class="flex-1 rounded" style="height:4px;background:var(--gray-300)" id="sb3"></div>
                  <div class="flex-1 rounded" style="height:4px;background:var(--gray-300)" id="sb4"></div>
                </div>
                <small id="strengthLabel" class="text-muted" style="font-size:.75rem">Password strength</small>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-600 small">Confirm New Password</label>
              <div class="input-group-custom position-relative">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" class="form-control form-control-custom" id="cp" placeholder="Repeat password" required style="padding-left:2.5rem;padding-right:2.5rem">
                <button type="button" class="btn p-0 position-absolute" style="right:.9rem;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--gray-400)" onclick="togglePwd('cp',this)"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <ul class="list-unstyled mb-4" style="font-size:.8rem;color:var(--gray-400)">
              <li id="r1"><i class="bi bi-circle me-1"></i>At least 8 characters</li>
              <li id="r2"><i class="bi bi-circle me-1"></i>One uppercase letter</li>
              <li id="r3"><i class="bi bi-circle me-1"></i>One number</li>
              <li id="r4"><i class="bi bi-circle me-1"></i>One special character</li>
            </ul>
            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-600">
              <i class="bi bi-shield-check me-2"></i>Reset Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  btn.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
}
document.getElementById('np').addEventListener('input', function() {
  const v = this.value;
  const checks = [v.length >= 8, /[A-Z]/.test(v), /[0-9]/.test(v), /[^A-Za-z0-9]/.test(v)];
  const score = checks.filter(Boolean).length;
  const colors = ['','#ef4444','#f59e0b','#22c55e','#16a34a'];
  const labels = ['','Weak','Fair','Good','Strong'];
  ['sb1','sb2','sb3','sb4'].forEach((id,i) => { document.getElementById(id).style.background = i < score ? colors[score] : 'var(--gray-300)'; });
  document.getElementById('strengthLabel').textContent = labels[score] || 'Password strength';
  document.getElementById('strengthLabel').style.color = colors[score] || 'var(--gray-400)';
  const rules = ['r1','r2','r3','r4'];
  rules.forEach((id,i) => {
    const el = document.getElementById(id);
    if (checks[i]) { el.style.color = '#22c55e'; el.querySelector('i').className = 'bi bi-check-circle-fill me-1'; }
    else { el.style.color = 'var(--gray-400)'; el.querySelector('i').className = 'bi bi-circle me-1'; }
  });
});
document.getElementById('resetForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (document.getElementById('np').value !== document.getElementById('cp').value) {
    showToast('Passwords do not match!', 'error'); return;
  }
  showLoader();
  setTimeout(() => { hideLoader(); showToast('Password reset successfully!', 'success'); setTimeout(() => window.location.href = 'login.html', 1200); }, 1500);
});
</script>
</body>
</html>
