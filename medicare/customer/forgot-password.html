<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password — MediCare Pharmacy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card">
          <div class="auth-logo">
            <div class="brand-icon"><i class="bi bi-lock-fill"></i></div>
            <div class="auth-title">Forgot Password?</div>
            <div class="auth-subtitle">Enter your email and we'll send you a reset link</div>
          </div>
          <div id="step1">
            <form id="fpForm">
              <div class="mb-4">
                <label class="form-label fw-600 small">Registered Email</label>
                <div class="input-group-custom">
                  <i class="bi bi-envelope input-icon"></i>
                  <input type="email" class="form-control form-control-custom" placeholder="priya@example.com" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-600">
                <i class="bi bi-send me-2"></i>Send Reset Link
              </button>
            </form>
          </div>
          <div id="step2" style="display:none;text-align:center">
            <div style="font-size:3.5rem;margin-bottom:1rem">📧</div>
            <h5 class="fw-700">Check Your Email</h5>
            <p class="text-muted" style="font-size:.88rem">We've sent a password reset link to <strong>priya@example.com</strong>. Please check your inbox and spam folder.</p>
            <a href="reset-password.html" class="btn btn-primary-custom w-100 mt-3">Go to Reset Password</a>
            <p class="mt-3 text-muted small">Didn't receive the email? <a href="#" class="text-primary" onclick="resend()">Resend in <span id="timer">60</span>s</a></p>
          </div>
          <p class="text-center mt-4 mb-0" style="font-size:.88rem">
            <a href="login.html" class="text-primary fw-600"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('fpForm').addEventListener('submit', function(e) {
  e.preventDefault();
  showLoader();
  setTimeout(() => {
    hideLoader();
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    let t = 60;
    const interval = setInterval(() => { t--; document.getElementById('timer').textContent = t; if (t <= 0) clearInterval(interval); }, 1000);
  }, 1500);
});
function resend() { showToast('Reset link resent!', 'info'); }
</script>
</body>
</html>
